<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;color:#172541;font:14px -apple-system,sans-serif}aside{position:fixed;inset:0 auto 0 0;width:190px;background:#f4f8ff;padding:28px 18px;border-right:1px solid #e0e8f5}h1{font-size:29px;margin:0}h2{font-size:18px}aside b{font-size:25px}nav{margin-top:36px}nav button{width:100%;text-align:left;margin:6px 0;border:0;background:none;padding:14px;color:#607493}nav .active{background:#e5efff;color:#1768ff}.local{position:absolute;bottom:30px;color:#7c8ea9}main{margin-left:190px;padding:30px}.heading{display:flex;align-items:center;justify-content:space-between}.heading p{color:#7586a1}.actions{display:flex;gap:8px}button{border:1px solid #d8e3f4;border-radius:6px;background:white;padding:10px 14px;color:#315682;cursor:pointer}.blue{background:#1768ff;color:white;border:0}.connection{background:#edf5ff;padding:18px;border-radius:8px;margin:22px 0;display:flex;justify-content:space-between;color:#456388}.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}.card,section{border:1px solid #dfe7f4;border-radius:9px;padding:18px}.card small{color:#8090aa;display:block;margin-bottom:13px}.card strong{font-size:18px}.warning{background:#fff7e9;border:1px solid #ffddaa;padding:14px;color:#a36a2e;border-radius:7px;margin:20px 0}section{margin-top:18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px;border-bottom:1px solid #e7edf7}th{color:#7d8da7;font-weight:500}tr.selected{background:#edf4ff}tbody tr{cursor:pointer}.stages{display:flex;gap:14px;padding:22px 0;color:#617b9d}.stages span{background:#f2f7ff;padding:13px;border-radius:7px}p{line-height:1.7;color:#6a7e9c}input{padding:12px;border:1px solid #d8e3f4;border-radius:6px;width:100%;margin:10px 0}#settings{max-width:700px}#record{overflow-wrap:anywhere}footer{margin-top:20px;color:#8595af;font-size:12px}[hidden]{display:none!important}</style>
<aside><b>◢ AppLens</b><nav><button class="active" data-page="overview">▣　采集总览</button><button data-page="uploads">▤　上传记录</button><button data-page="settings">⚙　连接设置</button></nav><div class="local">本机 · macOS<br>模型上下文采集</div></aside><main><div class="heading"><div><h1>模型上下文采集</h1><p>发现本机模型输入，保留原文并同步至所属账号。</p></div><div class="actions"><button onclick="send('open')">在平台查看 ↗</button><button id="pause" onclick="send('pause')">暂停采集</button></div></div>
<div id="overview"><div class="connection"><span id="connection">尚未配对 · 请打开连接设置</span><button onclick="page('settings')">连接设置</button></div><div class="cards"><div class="card"><small>应用</small><strong id="app">WorkBuddy · 正在检测</strong></div><div class="card"><small>采集器</small><strong id="collector">等待连接</strong></div><div class="card"><small>上传同步</small><strong id="upload">尚未上传</strong><button onclick="send('retry')">重试</button></div></div><div class="warning">源记录可能截断；原文哈希一致只确认已采集字节，不能证明模型服务接收。</div>
<section style="padding:0"><iframe id="captureScene" src="capture.html" title="采集现场" style="width:100%;height:410px;border:0"></iframe></section><section><h2>最近模型调用</h2><table><thead><tr><th>时间 / 调用</th><th>会话</th><th>模型</th><th>原文大小</th><th>完整性</th><th>上传</th></tr></thead><tbody id="rows"></tbody></table><p id="empty">尚无调用记录</p></section><section><h2 id="selected">选中调用 · 上传阶段</h2><div class="stages" id="stages"></div><p id="record"></p><button onclick="send('call',{id:selected})">查看这次调用 ↗</button><button onclick="send('records')">打开本机记录</button><p>采集边界：只读取 generation 装配输入，不采独立工具事件。无法确定的类别与完整性在平台明确标为未知。</p></section></div>
<section id="settings" hidden><h2>连接与首次配对</h2><label>平台地址<input id="server" value="https://50.118.187.180"></label><label>一次性配对码<input id="code" placeholder="在平台“我的设备”获取"></label><button class="blue" onclick="send('pair',{server:document.getElementById('server').value,code:document.getElementById('code').value})">配对并开始同步</button><p>设备凭证存放在本机钥匙串，重启无需重复配对。</p></section><footer id="status">正在启动</footer></main>
<script>let state={calls:[]},selected=null;function send(action,extra={}){window.webkit.messageHandlers.applens.postMessage({action,...extra});}function page(p){document.getElementById('settings').hidden=p!=='settings';document.getElementById('overview').hidden=p==='settings';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='uploads')document.getElementById('rows').scrollIntoView();}document.querySelector('nav').onclick=e=>{if(e.target.dataset.page)page(e.target.dataset.page);};function update(s){state=s;const scene=document.getElementById("captureScene");if(scene.contentWindow.updateCapture)scene.contentWindow.updateCapture(s);document.getElementById('connection').textContent=s.connected?s.server+' · 已绑定设备 '+(s.deviceId||''):'尚未配对 · 请打开连接设置';document.getElementById('app').textContent='WorkBuddy · '+(s.appRunning?'运行中':'未运行');document.getElementById('collector').textContent=s.active?'正在采集':'已暂停 / 等待连接';document.getElementById('pause').textContent=s.active?'暂停采集':'恢复采集';document.getElementById('status').textContent=s.status||'';document.getElementById('upload').textContent=s.synced+' / '+s.calls.length+' 已确认';const rows=document.getElementById('rows');rows.replaceChildren();document.getElementById('empty').hidden=!!s.calls.length;for(const c of s.calls){const tr=document.createElement('tr');for(const v of [new Date(c.timestamp*1000).toLocaleTimeString()+' · '+c.id.slice(0,8),c.sessionName||'未识别',c.model||'未采集',(c.bodyBytes/1024).toFixed(1)+' KB',c.wireLengthMatched?'请求体长度一致':c.truncated?'源记录截断':c.recordStatus==='parseable'?'可解析 · 未截断':'未验证',c.receipt?'回执哈希一致':'待上传']){const td=document.createElement('td');td.textContent=v;tr.append(td);}tr.onclick=()=>{selected=c.id;detail();};rows.append(tr);}if(!selected)selected=s.calls[0]?.id;detail();}function detail(){const c=state.calls.find(c=>c.id===selected);document.getElementById('selected').textContent=c?'调用 '+c.id.slice(0,12)+' · 上传阶段':'选中调用 · 上传阶段';document.getElementById('stages').replaceChildren();for(const v of ['发现记录','本机保存',c?.receipt?'上传成功':'待上传',c?.receipt?'平台回执一致':'等待平台回执']){const span=document.createElement('span');span.textContent=v;document.getElementById('stages').append(span);}document.getElementById('record').textContent=c?'SHA256 '+c.bodySHA256+' · 仅核验已采集原文。':'';}</script></html>
