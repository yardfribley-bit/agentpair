name: SessionLens desktop
on:
  workflow_dispatch:
  push:
    paths: ['SessionLens/**', 'agentpair/session_lens.py', '.github/workflows/sessionlens-desktop.yml']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: SessionLens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt
      - run: python -m unittest discover -s tests -v
      - run: python desktop_main.py --self-test
      - run: python -m PyInstaller --noconfirm --windowed --name SessionLens desktop_main.py
      - uses: actions/upload-artifact@v4
        with:
          name: SessionLens-${{ runner.os }}-${{ runner.arch }}
          path: SessionLens/dist/
          retention-days: 30
