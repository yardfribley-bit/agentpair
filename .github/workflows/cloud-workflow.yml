name: Cloud task workflow checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'agentpair/**'
      - 'windows/software-install.ps1'
      - 'tests/legacy/test_task*.py'
      - 'tests/legacy/test_platform.py'
      - 'tests/test_cloud*.py'
      - 'tests/test_*software*.py'
      - '.github/workflows/cloud-workflow.yml'
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test task routing, confirmation and portable installation
        run: python -m unittest tests.legacy.test_tasks tests.legacy.test_task_pauses tests.legacy.test_platform tests.test_cloud_console tests.test_cloud_workflow tests.test_cloud_workflow_http tests.test_software_install tests.test_portable_software tests.test_platform_assistant tests.legacy.test_resources -v
      - name: Check browser scripts
        run: node --check agentpair/web_assets/workspace.js
      - run: node --check agentpair/web_assets/software.js
