<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云机器 · AgentPair</title><link rel="stylesheet" href="/devices.css"><link rel="stylesheet" href="/cloud_machines.css"></head><body><aside><a class="brand" href="/">◢ AgentPair</a><nav aria-label="主导航"><a href="/">▣ <span>任务中心</span></a><a href="/devices">▤ <span>我的设备</span></a><a class="active" href="/cloud-machines">▣ <span>云机器</span></a><a href="/model-data">▧ <span>采集数据</span></a></nav></aside><main><header><span>资源 / 云机器</span><a href="/software">已接入设备安装 →</a></header><h1>云机器</h1><p>管理员按步骤完成报价、开机、连接和安装。每一步显示云端或系统的真实回执。</p><p id="notice" role="status"></p><div class="cloud-grid"><section class="cloud-card"><h2>1 · 选择并报价</h2><label>系统<select id="system"><option value="Windows">Windows Server 2022 · 2 核 4 GB</option><option value="Linux">Ubuntu 22.04 · 1 核 1 GB</option></select></label><div id="sizing-fields"><label>核数<select id="cpu"><option>1</option><option selected>2</option><option>4</option><option>8</option><option>16</option></select></label><label>内存（GB）<select id="memory"><option>1</option><option>2</option><option selected>4</option><option>8</option><option>16</option><option>32</option><option>64</option></select></label><label>系统盘（GB）<input id="system-disk" type="number" min="40" max="1000" value="40"></label><label>数据盘（GB，0 表示不配置）<input id="data-disk" type="number" min="0" max="1000" value="20"></label></div><button id="quote">查询实时价格</button><div id="price" class="muted">尚未报价</div><button id="create" disabled>确认报价并开机</button><p class="muted">开机按云厂商实际计费；创建动作只在点击确认后执行。默认租约 60 分钟，平台记录到期时间。</p></section><section class="cloud-card"><h2>2 · 查看机器与登录状态</h2><button id="refresh">刷新机器</button><div id="machines" class="machine-list">正在读取…</div></section></div><section class="cloud-card"><h2>3 · 安装软件</h2><p>选择已登记的软件方案；平台通过已验证的 SSH 连接执行下载、哈希校验、静默安装和版本验证。安装结果显示在下方。</p><label>机器<select id="install-machine"></select></label><label>软件<select id="install-software"></select></label><button id="install">执行安装</button><p id="install-status" role="status"></p><pre id="install-evidence" hidden></pre><a href="/software">登记 Windows 安装方案或查看 AppLens 设备安装任务 →</a></section></main><script src="/cloud_machines.js"></script></body></html>
