<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>软件包 · AgentPair</title><link rel="stylesheet" href="/devices.css"><link rel="stylesheet" href="/packages.css"></head><body>
<aside><a class="brand" href="/">◢ AgentPair</a><nav aria-label="主导航"><a href="/">▣ 任务中心</a><a href="/">⇄ 团队工作台</a><a href="/devices">▤ 我的设备</a><a class="active" href="/packages">▧ 软件包</a><a href="/">▥ 资源与凭证</a></nav></aside>
<main><header><span>资源 / 软件包</span><span id="identity">正在连接</span></header><div class="package-page"><div class="package-heading"><div><h1>软件包</h1><p>管理软件版本，让新机器复用已校验的安装包。</p></div><a id="register-link" class="package-primary" href="/software" hidden>＋ 登记软件包</a></div><p id="summary">正在读取真实软件目录…</p><div class="package-toolbar" aria-label="软件筛选"><button data-system="全部" aria-pressed="true">全部</button><button data-system="Windows" aria-pressed="false">Windows</button><button data-system="Linux" aria-pressed="false">Linux</button><input id="search" placeholder="搜索软件名称…" aria-label="搜索软件名称"><button id="refresh">刷新</button></div>
<div class="package-layout"><section><div class="package-panel"><table><thead><tr><th>软件 / 系统</th><th>版本</th><th>缓存状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table><p id="empty" hidden>没有匹配的软件；尚未登记的软件不会自动显示。</p></div><section class="package-panel package-node"><h2>缓存节点</h2><strong id="node-name">尚未配置</strong><p id="node-state"></p><p id="node-usage"></p><small>Windows 安装包分发 · apt 缓存尚未接入</small></section><p class="package-note">“已登记”不代表已缓存；“在线”不代表每个软件包可下载。</p></section>
<section class="package-panel package-details" aria-live="polite"><h2 id="detail-name">选择软件查看详情</h2><span id="detail-status"></span><dl id="fields"></dl><h3>可用版本</h3><p id="version">—</p><h3>缓存校验</h3><p id="verified">—</p><div class="package-actions"><button id="install" class="package-primary" hidden>安装到设备</button><button id="preload" hidden>预下载</button></div><section id="install-box" hidden><h3>选择目标设备</h3><select id="device" aria-label="目标设备"></select><p id="source"></p><button id="confirm">确认下发安装</button><p id="progress" role="status"></p></section><p id="permission"></p></section></div><p id="notice" role="status"></p></div></main><script src="/packages.js"></script></body></html>
