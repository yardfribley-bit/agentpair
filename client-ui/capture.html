<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#182435;font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei UI",sans-serif}header{display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #dce3ed}h2{font-size:17px;margin:0}small,.muted{color:#586a80;font-size:12px}.workspace{display:table;table-layout:fixed;width:100%;padding:18px;border-spacing:10px 0}.pane{display:table-cell;vertical-align:top;width:43%;min-width:0}.bridge{display:table-cell;width:14%;vertical-align:middle;text-align:center;color:#245fe4}.head{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}.box{padding:12px;border:1px solid #dce3ed;border-radius:7px;min-height:120px}.source{background:#f4f6fa}.channel{font-size:12px;display:block;margin-bottom:18px;color:#586a80}.scan{display:inline-block;border:1px solid #dce3ed;border-radius:50%;padding:10px;background:#e9f0ff}.rail{height:2px;background:#dce3ed;margin-top:20px;position:relative}.packet{display:block;position:absolute;width:12px;height:6px;background:#245fe4;left:0;top:-2px;opacity:0}.moving .packet{animation:transfer 1.1s ease-in-out 1}.moving .scan{animation:scan .8s ease-in-out 1}pre{font:12px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;margin:8px 0;max-height:145px;overflow:auto}strong{font-weight:600}.queue{margin-top:12px;background:#e9f0ff;border-radius:6px;padding:10px}.destination{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #dce3ed;margin-top:16px;padding-top:12px}.stages{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid #dce3ed;font-size:12px;color:#586a80}.done{color:#167448}.current{color:#245fe4;font-weight:600}.error{color:#a25b08}.details{display:flex;gap:18px;flex-wrap:wrap;padding:0 18px 14px;font-size:12px;color:#586a80}.empty{color:#586a80}#record{overflow-wrap:anywhere;word-wrap:break-word}#received{color:#167448}@keyframes transfer{0%{opacity:0;left:0}20%{opacity:1}80%{opacity:1}100%{opacity:0;left:90%}}@keyframes scan{50%{transform:translateY(-10px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:520px){.workspace,.pane,.bridge{display:block;width:100%}.bridge{padding:14px}.rail{width:100px;margin:10px auto}.channel{margin-bottom:8px}.pane{margin-bottom:12px}.workspace{padding:12px}.head{flex-wrap:wrap}}
</style></head><body><header><h2>采集现场</h2><small id="status" role="status" aria-live="polite">等待采集状态</small></header><div class="workspace" id="scene"><article class="pane"><div class="head"><strong>WorkBuddy</strong><small id="running">等待检测</small></div><div class="box source"><small id="source">采集来源尚未确认</small><pre id="preview">新记录出现后显示已采集正文的片段。</pre><small id="scope">只显示已采集内容</small></div><small id="record">尚无记录</small></article><div class="bridge"><span class="channel" id="channel">等待捕获</span><span class="scan">捕获</span><div class="rail"><span class="packet"></span></div></div><article class="pane"><div class="head"><strong>AppLens</strong><small id="active">等待启动</small></div><div class="box"><small>最近捕获</small><p id="captured">尚无新记录</p><small id="bytes">—</small><div class="queue" id="queue">本地队列 · 0 份待上传</div></div><div class="destination"><div><strong>AgentPair 平台</strong><div id="receipt" class="muted">尚未取得回执</div></div><span id="received">—</span></div></article></div><div class="stages" id="stages"><span>① 发现记录</span><span>② 捕获正文</span><span>③ 本地保存</span><span>④ 上传</span><span>⑤ 平台回执</span></div><div class="details"><span id="connection">尚未配对</span><span id="time">—</span><span>回执确认 AgentPair 收到记录；不表示模型服务已收到。</span></div><script>
(function(){var lastKey='',lastFingerprint='',initialized=false;function text(id,value){document.getElementById(id).textContent=value;}window.updateCaptureJSON=function(s){window.updateCapture(JSON.parse(s));};window.updateCapture=function(s){s=s||{};var calls=(s.calls||[]).slice(),c=null,pending=0,i;var event=s.captureEvent||{};if(event.record){for(i=0;i<calls.length;i++){if(calls[i].id===event.record.id){calls[i]=event.record;break;}}if(i===calls.length)calls.unshift(event.record);}for(i=0;i<calls.length;i++){if(!calls[i].receipt)pending++;}for(i=0;i<calls.length;i++){if(calls[i].id===event.id)c=calls[i];}if(!c&&calls.length)c=calls[0];var phase=c?(c.receipt?'received':'queued'):'waiting';if(event.phase&&c&&event.id===c.id&&(!event.bodySHA256||event.bodySHA256===c.bodySHA256)&&(event.phase!=='received'||c.receipt))phase=event.phase;if(!s.active&&phase!=='received')phase=c?'paused':'waiting';var titles={waiting:'等待 WorkBuddy 新记录',captured:'已捕获正文',queued:'原文已保存在本地',uploading:'正在上传到 AgentPair',received:'平台已确认接收',failed:'上传失败 · 本地记录等待重试',paused:'已暂停采集'};text('status',titles[phase]||titles.waiting);document.getElementById('status').className=phase==='failed'?'error':'';text('running',s.appRunning?'运行中':'未运行');text('active',s.active?'采集已开启':'已暂停 / 等待连接');text('connection',s.connected?'已绑定平台':'尚未配对');text('queue','本地队列 · '+pending+' 份待上传');var network=c&&String(c.source||'').indexOf('network')>=0;var source=c?(network?'HTTP 请求正文':'应用装配上下文'):'采集来源尚未确认';text('source',source);text('channel',c?source:'等待捕获');text('preview',c?(c.preview||'本地保留原文；此记录未提供片段。'):'新记录出现后显示已采集正文的片段。');text('scope',c?'正文片段 · '+(c.truncated?'源记录截断':network?'网络正文通道':'应用记录通道'):'只显示已采集内容');text('record',c?'记录 '+String(c.id).slice(0,12)+' · '+(c.sessionName||'会话未识别'):'尚无记录');text('captured',c?'WorkBuddy · '+source:'尚无新记录');text('bytes',c?(Number(c.bodyBytes||0)/1024).toFixed(1)+' KB · 原文保存在本机':'—');text('receipt',phase==='received'?'回执哈希一致':phase==='uploading'?'发送中':phase==='failed'?'等待重试':'尚未取得回执');text('received',phase==='received'?'✓':'—');text('time',c?'记录时间 '+new Date(c.timestamp*1000).toLocaleString():'—');var index={waiting:0,captured:2,queued:3,uploading:4,received:5,failed:4,paused:3}[phase]||0;var spans=document.getElementById('stages').children;for(i=0;i<spans.length;i++)spans[i].className=i<index-1?'done':i===index-1?'current':'';var key=c?c.id+'|'+c.bodySHA256:'';var fingerprint=key+'|'+phase;var scene=document.getElementById('scene');if(initialized&&key&&fingerprint!==lastFingerprint&&(key!==lastKey||phase==='uploading'||phase==='received')){scene.className='workspace';void scene.offsetWidth;scene.className='workspace moving';}lastKey=key;lastFingerprint=fingerprint;initialized=true;};window.addEventListener('message',function(e){if(e.source===window.parent&&e.data&&e.data.type==='applens-capture')window.updateCapture(e.data.state);});})();
</script></body></html>
