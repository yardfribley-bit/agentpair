<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#182435;font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei UI",sans-serif}header{display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #dce3ed}h2{font-size:17px;margin:0}small,.muted{color:#586a80;font-size:12px}.workspace{display:table;table-layout:fixed;width:100%;padding:18px;border-spacing:10px 0}.pane{display:table-cell;vertical-align:top;width:43%;min-width:0}.bridge{display:table-cell;width:14%;vertical-align:middle;text-align:center;color:#245fe4}.head{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}.box{padding:12px;border:1px solid #dce3ed;border-radius:7px;min-height:120px}.source{background:#f4f6fa}.channel{font-size:12px;display:block;margin-bottom:18px;color:#586a80}.scan{display:inline-block;border:1px solid #dce3ed;border-radius:50%;padding:10px;background:#e9f0ff}.rail{height:2px;background:#dce3ed;margin-top:20px;position:relative}.packet{display:block;position:absolute;width:12px;height:6px;background:#245fe4;left:0;top:-2px;opacity:0}.moving .packet{animation:transfer 1.1s ease-in-out 1}.moving .scan{animation:scan .8s ease-in-out 1}pre{font:12px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;margin:8px 0;max-height:145px;overflow:auto}strong{font-weight:600}.queue{margin-top:12px;background:#e9f0ff;border-radius:6px;padding:10px}.destination{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #dce3ed;margin-top:16px;padding-top:12px}.stages{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid #dce3ed;font-size:12px;color:#586a80}.done{color:#167448}.current{color:#245fe4;font-weight:600}.error{color:#a25b08}.details{display:flex;gap:18px;flex-wrap:wrap;padding:0 18px 14px;font-size:12px;color:#586a80}.empty{color:#586a80}#record{overflow-wrap:anywhere;word-wrap:break-word}#received{color:#167448}@keyframes transfer{0%{opacity:0;left:0}20%{opacity:1}80%{opacity:1}100%{opacity:0;left:90%}}@keyframes scan{50%{transform:translateY(-10px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:520px){.workspace,.pane,.bridge{display:block;width:100%}.bridge{padding:14px}.rail{width:100px;margin:10px auto}.channel{margin-bottom:8px}.pane{margin-bottom:12px}.workspace{padding:12px}.head{flex-wrap:wrap}}
.inventory{padding:0 18px 18px}.inventory h3{font-size:15px;margin:12px 0 3px}.inventory>p{margin:0 0 14px;font-size:12px;color:#586a80}.content-row{display:table;table-layout:fixed;width:100%;border-top:1px solid #dce3ed;padding:12px 0}.content-label{display:table-cell;width:170px;vertical-align:top}.content-label strong{display:block;color:#245fe4}.content-copy{display:table-cell;vertical-align:top;padding-right:12px}.content-copy pre{margin:4px 0;max-height:220px}.content-state{display:table-cell;width:125px;vertical-align:top;font-size:12px}.tag{display:inline-block;padding:3px 7px;margin:3px 4px 3px 0;background:#e9f0ff;color:#245fe4;border-radius:4px;font-size:12px}.content-row button{font:12px inherit;border:1px solid #dce3ed;border-radius:4px;background:#fff;color:#315682;padding:5px 9px;cursor:pointer}[hidden]{display:none!important}@media(max-width:600px){.content-row,.content-label,.content-copy,.content-state{display:block;width:100%}.content-copy{padding:0}.content-state{margin-top:8px}}
</style></head><body><header><h2>采集现场</h2><small id="status" role="status" aria-live="polite">等待采集状态</small></header><div class="workspace" id="scene"><article class="pane"><div class="head"><strong>WorkBuddy</strong><small id="running">等待检测</small></div><div class="box source"><small id="source">采集来源尚未确认</small><pre id="preview">新记录出现后显示已采集正文的片段。</pre><small id="scope">只显示已采集内容</small></div><small id="record">尚无记录</small></article><div class="bridge"><span class="channel" id="channel">等待捕获</span><span class="scan">捕获</span><div class="rail"><span class="packet"></span></div></div><article class="pane"><div class="head"><strong>AppLens</strong><small id="active">等待启动</small></div><div class="box"><small>最近捕获</small><p id="captured">尚无新记录</p><small id="bytes">—</small><div class="queue" id="queue">本地队列 · 0 份待上传</div></div><div class="destination"><div><strong>AgentPair 平台</strong><div id="receipt" class="muted">尚未取得回执</div></div><span id="received">—</span></div></article></div><div class="stages" id="stages"><span>① 发现记录</span><span>② 捕获正文</span><span>③ 本地保存</span><span>④ 上传</span><span>⑤ 平台回执</span></div><section class="inventory"><h3>这份模型请求包含什么</h3><p id="inventory-summary">等待采集正文，暂未识别内容。</p><div id="inventory"></div></section><div class="details"><span id="connection">尚未配对</span><span id="time">—</span><span>回执确认 AgentPair 收到记录；不表示模型服务已收到。</span></div><script>
(function(){
var drawnInventoryKey='',parsedInventoryKey='',cachedGroups=[];function bytes(value){return unescape(encodeURIComponent(value)).length;}
function inventory(raw){var rows=[],parsed;function add(label,basis,text){if(typeof text!=='string')text=JSON.stringify(text,null,2);if(text===undefined)text='';var row=null;for(var i=0;i<rows.length;i++)if(rows[i].label===label)row=rows[i];if(!row){row={label:label,basis:basis,parts:[],sources:[],bytes:0};rows.push(row);}row.parts.push(text);row.sources.push(basis);row.bytes+=bytes(text);}
function split(role,text,basis){var name={system:'WorkBuddy 的规则和背景',developer:'WorkBuddy 的规则和背景',user:'用户说的话',assistant:'历史中的模型回答',tool:'工具带回来的内容',function:'工具带回来的内容'}[role]||'未分类正文';if(typeof text!=='string'){add(name,basis,text);return;}var query=/<user_query>([\s\S]*?)<\/user_query>/g,m,cursor=0;while((m=query.exec(text))){if(m.index>cursor)add(name,basis,text.slice(cursor,m.index));add('本次任务（原文标记）','原文 user_query 标记',m[1]);cursor=query.lastIndex;}if(cursor){if(cursor<text.length)add(name,basis,text.slice(cursor));return;}var pattern=/^#{1,6}[ \t]+`?(SOUL|IDENTITY|USER|MEMORY|AGENTS|CLAUDE)\.md`?[ \t]*(?:\r?\n|$)/gm;var matches=[];while((m=pattern.exec(text)))matches.push({start:m.index,end:pattern.lastIndex,level:m[0].match(/^#+/)[0].length,file:m[1]+'.md'});if(!matches.length){add(name,basis,text);return;}cursor=0;for(var k=0;k<matches.length;k++){var header=matches[k];if(header.start>cursor)add(name,basis,text.slice(cursor,header.start));var next=new RegExp('^#{1,'+header.level+'}[ \t]+','m').exec(text.slice(header.end));var end=next?header.end+next.index:text.length;var labels={'MEMORY.md':'记忆内容','USER.md':'用户资料','AGENTS.md':'项目规范','CLAUDE.md':'项目规范','SOUL.md':'身份与行为规则','IDENTITY.md':'身份与行为规则'};add(labels[header.file],'请求正文中的 '+header.file+' 章节',text.slice(header.start,end));cursor=end;}if(cursor<text.length)add(name,basis,text.slice(cursor));}
try{parsed=JSON.parse(raw);}catch(e){add('未分类正文','原文未能完整解析',raw);return rows;}var messages=Object.prototype.toString.call(parsed)==='[object Array]'?parsed:parsed&&parsed.messages;if(Object.prototype.toString.call(messages)!=='[object Array]'){add('其他请求内容','没有 messages 消息结构',parsed);return rows;}for(var i=0;i<messages.length;i++){var msg=messages[i];if(!msg||typeof msg!=='object'){add('未分类消息','messages['+i+']',msg);continue;}var role=msg.role||'未知';var basis='消息 '+(i+1)+' · '+role+' 角色';var content=msg.content;if(Object.prototype.toString.call(content)==='[object Array]'){for(var b=0;b<content.length;b++){var block=content[b];if(block&&typeof block==='object'&&(block.type==='image_url'||block.type==='input_image'))add('图片或图片引用',basis,block);else split(role,block&&typeof block.text==='string'?block.text:block,basis);}}else split(role,content,basis);var extras={};for(var key in msg)if(Object.prototype.hasOwnProperty.call(msg,key)&&key!=='role'&&key!=='content')extras[key]=msg[key];if(Object.keys(extras).length)add('消息附带的字段',basis,extras);}if(parsed&&Object.prototype.toString.call(parsed)!=='[object Array]'){var fields={};for(var key in parsed)if(Object.prototype.hasOwnProperty.call(parsed,key)&&key!=='messages')fields[key]=parsed[key];if(Object.keys(fields).length)add('模型参数与请求附带字段','请求顶层字段',fields);}var order={'本次任务（原文标记）':0,'用户说的话':1,'项目规范':2,'记忆内容':3,'用户资料':4,'身份与行为规则':5,'WorkBuddy 的规则和背景':6,'历史中的模型回答':7,'工具带回来的内容':8,'图片或图片引用':9,'模型参数与请求附带字段':10};rows.sort(function(a,b){var x=Object.prototype.hasOwnProperty.call(order,a.label)?order[a.label]:11;var y=Object.prototype.hasOwnProperty.call(order,b.label)?order[b.label]:11;return x-y;});return rows;}
function renderInventory(rows,c,phase){var host=document.getElementById('inventory');var inventoryKey=(c.id||'')+'|'+(c.bodySHA256||'')+'|'+rows.length;var stateText=c.receipt?'✓ 已同步到 AgentPair':phase==='uploading'?'正在同步到 AgentPair':phase==='failed'?'未确认上传 · 待重试':'本地保存 · 待上传';var stateClass='content-state'+(c.receipt?' done':phase==='failed'?' error':'');if(drawnInventoryKey===inventoryKey&&rows.length){var badges=host.querySelectorAll('.content-state');for(var j=0;j<badges.length;j++){badges[j].textContent=stateText;badges[j].className=stateClass;}document.getElementById('inventory-summary').textContent=rows.length+' 类内容 · '+(c.receipt?'整份正文已同步到 AgentPair，回执一致':'整份正文保存在本机，尚未确认上传')+' · 内容大小按 UTF-8 文本计算';return;}drawnInventoryKey=inventoryKey;host.textContent='';document.getElementById('inventory-summary').textContent=rows.length?rows.length+' 类内容 · '+(c.receipt?'整份正文已同步到 AgentPair，回执一致':'整份正文保存在本机，尚未确认上传')+' · 内容大小按 UTF-8 文本计算':'未取得与这份记录匹配的正文，暂不分类。';var tags=[];for(var i=0;i<rows.length;i++){var row=rows[i],div=document.createElement('div');div.className='content-row';var label=document.createElement('div');label.className='content-label';var name=document.createElement('strong');name.textContent=row.label;var size=document.createElement('small');size.textContent=row.parts.length+' 段 · '+(row.bytes/1024).toFixed(1)+' KB';label.appendChild(name);label.appendChild(size);var copy=document.createElement('div');copy.className='content-copy';var preview=document.createElement('pre');preview.textContent=row.parts[0].slice(0,280)+(row.parts[0].length>280?'…':'');var source=document.createElement('small');source.textContent=row.sources.slice(0,3).join('；')+(row.sources.length>3?'；另有 '+(row.sources.length-3)+' 处':'');copy.appendChild(preview);copy.appendChild(source);var full=document.createElement('pre');var fullParts=[];for(var pi=0;pi<row.parts.length;pi++)fullParts.push(row.sources[pi]+'\n'+row.parts[pi]);full.textContent=fullParts.join('\n\n──── 下一段 ────\n\n');full.hidden=true;var button=document.createElement('button');button.type='button';button.textContent='展开 '+row.parts.length+' 段原文';button.setAttribute('aria-expanded','false');(function(btn,all,short){btn.onclick=function(){all.hidden=!all.hidden;short.hidden=!all.hidden;btn.textContent=all.hidden?'展开原文':'收起原文';btn.setAttribute('aria-expanded',String(!all.hidden));reportHeight();};})(button,full,preview);copy.appendChild(button);copy.appendChild(full);var state=document.createElement('div');state.className='content-state'+(c.receipt?' done':phase==='failed'?' error':'');state.textContent=c.receipt?'✓ 已同步到 AgentPair':phase==='uploading'?'正在同步到 AgentPair':phase==='failed'?'未确认上传 · 待重试':'本地保存 · 待上传';div.appendChild(label);div.appendChild(copy);div.appendChild(state);host.appendChild(div);tags.push(row.label);}document.getElementById('scope').textContent=tags.length?'包含：'+tags.join('、'):'只显示已采集内容';}
function reportHeight(){if(window.parent!==window)window.parent.postMessage({type:'applens-capture-height',height:document.body.scrollHeight},'*');}
var lastKey='',lastFingerprint='',initialized=false;function text(id,value){document.getElementById(id).textContent=value;}window.updateCaptureJSON=function(s){window.updateCapture(JSON.parse(s));};window.updateCapture=function(s){s=s||{};var calls=(s.calls||[]).slice(),c=null,pending=0,i;var event=s.captureEvent||{};if(event.record){for(i=0;i<calls.length;i++){if(calls[i].id===event.record.id){calls[i]=event.record;break;}}if(i===calls.length)calls.unshift(event.record);}for(i=0;i<calls.length;i++){if(!calls[i].receipt)pending++;}for(i=0;i<calls.length;i++){if(calls[i].id===event.id)c=calls[i];}if(!c&&calls.length)c=calls[0];var phase=c?(c.receipt?'received':'queued'):'waiting';if(event.phase&&c&&event.id===c.id&&(!event.bodySHA256||event.bodySHA256===c.bodySHA256)&&(event.phase!=='received'||c.receipt))phase=event.phase;if(!s.active&&phase!=='received')phase=c?'paused':'waiting';var titles={waiting:'等待 WorkBuddy 新记录',captured:'已捕获正文',queued:'原文已保存在本地',uploading:'正在上传到 AgentPair',received:'平台已确认接收',failed:'上传失败 · 本地记录等待重试',paused:'已暂停采集'};text('status',titles[phase]||titles.waiting);document.getElementById('status').className=phase==='failed'?'error':'';text('running',s.appRunning?'运行中':'未运行');text('active',s.active?'采集已开启':'已暂停 / 等待连接');text('connection',s.connected?'已绑定平台':'尚未配对');text('queue','本地队列 · '+pending+' 份待上传');var network=c&&String(c.source||'').indexOf('network')>=0;var source=c?(network?'HTTP 请求正文':'应用装配上下文'):'采集来源尚未确认';text('source',source);text('channel',c?source:'等待捕获');text('source',source+(c&&c.destination?' · '+c.destination:''));text('preview',c?(c.preview||'本地保留原文；此记录未提供片段。'):'新记录出现后显示已采集正文的片段。');text('scope',c?'正文片段 · '+(c.truncated?'源记录截断':network?'网络正文通道':'应用记录通道'):'只显示已采集内容');text('record',c?'记录 '+String(c.id).slice(0,12)+' · '+(c.sessionName||'会话未识别'):'尚无记录');text('captured',c?'WorkBuddy · '+source:'尚无新记录');text('bytes',c?(Number(c.bodyBytes||0)/1024).toFixed(1)+' KB · 原文保存在本机':'—');text('receipt',phase==='received'?'回执哈希一致':phase==='uploading'?'发送中':phase==='failed'?'等待重试':'尚未取得回执');text('received',phase==='received'?'✓':'—');text('time',c?'记录时间 '+new Date(c.timestamp*1000).toLocaleString():'—');var raw=c&&s.captureBodyId===c.id&&s.captureBodySHA256===c.bodySHA256?s.captureBody:'';var rawKey=raw?c.id+'|'+c.bodySHA256:'';if(rawKey!==parsedInventoryKey){cachedGroups=raw?inventory(raw):[];parsedInventoryKey=rawKey;}renderInventory(cachedGroups,c||{},phase);if(cachedGroups.length){var names=[],task=null;for(var gi=0;gi<cachedGroups.length;gi++){names.push(cachedGroups[gi].label);if(cachedGroups[gi].label==='本次任务（原文标记）')task=cachedGroups[gi];else if(!task&&cachedGroups[gi].label==='用户说的话')task=cachedGroups[gi];}var visible=task||cachedGroups[0];var fragment=visible.parts[visible.parts.length-1];text('preview',visible.label+'\n'+fragment.slice(0,280)+(fragment.length>280?'…':''));text('scope','包含：'+names.join('、'));}reportHeight();var index={waiting:0,captured:2,queued:3,uploading:4,received:5,failed:4,paused:3}[phase]||0;var spans=document.getElementById('stages').children;for(i=0;i<spans.length;i++)spans[i].className=i<index-1?'done':i===index-1?'current':'';var key=c?c.id+'|'+c.bodySHA256:'';var fingerprint=key+'|'+phase;var scene=document.getElementById('scene');if(initialized&&key&&fingerprint!==lastFingerprint&&(key!==lastKey||phase==='uploading'||phase==='received')){scene.className='workspace';void scene.offsetWidth;scene.className='workspace moving';}lastKey=key;lastFingerprint=fingerprint;initialized=true;};window.addEventListener('message',function(e){if(e.source===window.parent&&e.data&&e.data.type==='applens-capture')window.updateCapture(e.data.state);});})();
</script></body></html>
